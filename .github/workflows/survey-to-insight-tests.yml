
name: Survey-to-Insight Validation Tests

on:
  push:
    paths:
      - "research_demos/survey_to_insight/**"
      - ".github/workflows/survey-to-insight-tests.yml"
  pull_request:
    paths:
      - "research_demos/survey_to_insight/**"
      - ".github/workflows/survey-to-insight-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-survey-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install testing dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas pytest

      - name: Run survey validation tests
        working-directory: research_demos/survey_to_insight
        run: python -m pytest -v test_validate_data.py
