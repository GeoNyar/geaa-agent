
name: Survey-to-Insight Validation and Data Generation

on:
  push:
    paths:
      - "research_demos/survey_to_insight/**"
      - ".github/workflows/survey-to-insight-tests.yml"
  pull_request:
    paths:
      - "research_demos/survey_to_insight/**"
      - ".github/workflows/survey-to-insight-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-generate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy matplotlib pytest openpyxl

      - name: Run automated tests
        working-directory: research_demos/survey_to_insight
        run: python -m pytest -v

      - name: Generate synthetic survey responses
        working-directory: research_demos/survey_to_insight
        run: |
          python generate_synthetic_data.py \
            --n 100 \
            --seed 20261023 \
            --output synthetic_responses.csv

      - name: Validate generated dataset
        working-directory: research_demos/survey_to_insight
        run: |
          python validate_data.py \
            synthetic_responses.csv \
            --report validation_report.json

      - name: Analyse validated survey data
        working-directory: research_demos/survey_to_insight
        run: |
          python analyse_survey.py \
            --input synthetic_responses.csv \
            --output-dir analysis_outputs

      - name: Create consolidated Excel workbook
        working-directory: research_demos/survey_to_insight
        run: |
          python create_excel_workbook.py \
            --analysis-dir analysis_outputs \
            --output analysis_outputs/survey_to_insight_workbook.xlsx

      - name: Upload survey analysis artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: survey-to-insight-analysis
          path: |
            research_demos/survey_to_insight/synthetic_responses.csv
            research_demos/survey_to_insight/validation_report.json
            research_demos/survey_to_insight/analysis_outputs/
          if-no-files-found: error
          retention-days: 30
