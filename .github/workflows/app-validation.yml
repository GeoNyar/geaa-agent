name: Validate GEAA app

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/research-data-mode", "geaa-v1.3-resilience"]

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install app dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile app and resilience helper
        run: python -m py_compile app.py geaa_ai.py

      - name: Run Gemini resilience tests
        run: python -m unittest -v test_gemini_resilience.py
