
name: GEAA Retrieval Regression Tests

on:
  push:
    branches: [main, "geaa-v1.3-resilience"]
  pull_request:
    branches: [main, "geaa-v1.3-resilience"]
  workflow_dispatch:

jobs:
  test-retrieval:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run retrieval regression tests
        run: python -m unittest -v test_retrieval
